<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Under Construction</title>
  <meta name="description" content="Website under construction. Hosting setup in progress." />

  <!-- Lenis (requested) -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

  <style>
    :root{
      /* PREVIOUS BACKGROUND COLORS (gradient) */
      --bg1:#070A14;
      --bg2:#0B1224;

      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --border: rgba(255,255,255,.12);

      --size: clamp(140px, 38vw, 280px);
      --stroke: clamp(16px, 4vw, 34px);
    }

    /* hide scrollbar */
    *{ scrollbar-width:none; }
    *::-webkit-scrollbar{ width:0; height:0; }

    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--text);

      /* BACK TO PREVIOUS GRADIENT LOOK */
      background:
        radial-gradient(900px 500px at 30% 20%, rgba(124,58,237,.22), transparent 60%),
        radial-gradient(900px 500px at 70% 30%, rgba(6,182,212,.18), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));

      display:grid;
      place-items:center;
      padding: 24px;
      overflow-x:hidden;
    }

    .wrap{
      width: min(680px, 92vw);
      text-align:center;
      display:grid;
      place-items:center;
      gap: 14px;
    }

    .card{
      width: 100%;
      padding: clamp(18px, 4.8vw, 28px);
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,.38);
    }

    /* ---------- Loader (same as before) ---------- */
    .loader{
      width: var(--size);
      height: var(--size);
      margin: 4px auto 10px;
      display:grid;
      place-items:center;
      animation: spin 1.05s linear infinite;
      filter: drop-shadow(0 18px 45px rgba(255,255,255,.06));
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader svg{ width:100%; height:100%; display:block; }
    .arc{
      fill: none;
      stroke: url(#g);
      stroke-width: var(--stroke);
      stroke-linecap: round;
      stroke-dasharray: 210 440; /* arc + gap */
      stroke-dashoffset: 10;
      opacity: .95;
    }

    h1{
      margin: 0;
      font-size: clamp(18px, 2.6vw, 26px);
      letter-spacing: -0.3px;
    }
    p{
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: clamp(13px, 1.8vw, 15px);
    }

    .pill{
      margin-top: 14px;
      display:inline-flex;
      align-items:center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.75);
      font-size: 12px;
    }
    .dot{
      width: 9px; height: 9px;
      border-radius: 50%;
      background: rgba(245,158,11,.95);
      box-shadow: 0 0 0 6px rgba(245,158,11,.12);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{ transform: scale(1); opacity: .9; }
      50%{ transform: scale(1.2); opacity: .65; }
    }

    .foot{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,.50);
    }

    @media (prefers-reduced-motion: reduce){
      .loader,.dot{ animation:none !important; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card" aria-label="Under construction">
      <div class="loader" aria-hidden="true">
        <svg viewBox="0 0 200 200" role="img" aria-label="Loading">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.95"/>
              <stop offset="55%" stop-color="#d9d9d9" stop-opacity="0.75"/>
              <stop offset="100%" stop-color="#9a9a9a" stop-opacity="0.45"/>
            </linearGradient>
          </defs>
          <circle class="arc" cx="100" cy="100" r="70"></circle>
        </svg>
      </div>

      <h1>Website Under Construction</h1>
      <p>Hosting setup is in progress. We’re finishing deployment and final checks.</p>

      <div class="pill" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        Please check back soon
      </div>

      <div class="foot">© <span id="y"></span> • Temporary landing page</div>
    </section>
  </main>

  <script>
    // Lenis (requested)
    if (window.Lenis) {
      const lenis = new Lenis({ duration: 1.0, smoothWheel: true });
      const raf = (t) => { lenis.raf(t); requestAnimationFrame(raf); };
      requestAnimationFrame(raf);
    }
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
